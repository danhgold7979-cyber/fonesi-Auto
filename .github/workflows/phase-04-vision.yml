name: Phase 04 portable source and Windows vision compile
on:
  push:
    branches: [phase-04]
    paths:
      - 'desktop/**'
      - 'foundation/**'
      - 'biome.json'
      - '.gitattributes'
      - 'tools/phase-00/HostProbeNative.cs'
      - '.github/workflows/phase-04-vision.yml'
  workflow_dispatch:
    inputs:
      run_native_ownership:
        description: 'Reviewed owned synthetic Windows process/pipe/Job fixtures only; no Python runtime, model or device'
        required: false
        type: boolean
        default: false
      run_materialization:
        description: 'Reviewed fixed Windows materialization and metadata only; no model inference or device'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-source-and-compile:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Select existing admitted source-test Python, not the candidate runtime
        run: |
          $candidate=Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TOOL_CACHE 'Python') -Directory | Where-Object {$_.Name -match '^3\.12\.\d+$'} | Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
          if($null -eq $candidate){throw 'SOURCE_PYTHON_MISSING'}
          $exe=Join-Path $candidate.FullName 'x64/python.exe';$item=Get-Item -LiteralPath $exe -Force
          if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)){throw 'SOURCE_PYTHON_REJECTED'}
          "FOUNDATION_PYTHON_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Scripts-disabled restore and portable desktop source checks
        run: |
          node desktop/scripts/check.mjs --restore
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Unchanged foundation source checks
        run: |
          $version=(& npm --version).Trim()
          node foundation/scripts/verify-bootstrap.mjs $version
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          npm --prefix foundation ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --cache=.npm-cache
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node foundation/scripts/check.mjs $version
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Exact portable Python inventory with no skipped tests
        run: |
          & $env:FOUNDATION_PYTHON_EXE -B desktop/verification/run_vision_source_tests.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Compile vision owner and fixture without loading or executing them
        run: |
          & desktop/verification/Invoke-VisionQualification.ps1 -Mode Compile
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Write-Output 'WINDOWS_NATIVE_OWNERSHIP_NOT_RUN'
          Write-Output 'WINDOWS_OCR_RUNTIME_NOT_MATERIALIZED'
          Write-Output 'WINDOWS_OCR_MODEL_NOT_RUN'
          Write-Output 'VI_REQUIRED_UNAVAILABLE'
          Write-Output 'DEVICE_HARDWARE_NOT_RUN'
      - name: Validate mutually exclusive reviewed vision campaigns
        id: validate_vision_campaign
        env:
          VISION_MANAGED_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_native_ownership == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[vision-managed]')) }}
          VISION_MATERIALIZATION_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_materialization == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[vision-materialize]')) }}
          VISION_PUSH: ${{ github.event_name == 'push' }}
          VISION_REF: ${{ github.ref }}
          VISION_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          foreach($value in @($env:VISION_MANAGED_REQUESTED,$env:VISION_MATERIALIZATION_REQUESTED,$env:VISION_PUSH)){if($value -cnotin @('true','false')){throw 'VISION_CAMPAIGN_FLAGS_REJECTED'}}
          if($env:VISION_MANAGED_REQUESTED -ceq 'true' -and $env:VISION_MATERIALIZATION_REQUESTED -ceq 'true'){throw 'VISION_CAMPAIGNS_MUTUALLY_EXCLUSIVE'}
          if(($env:VISION_MANAGED_REQUESTED -ceq 'true' -or $env:VISION_MATERIALIZATION_REQUESTED -ceq 'true') -and $env:VISION_REF -cne 'refs/heads/phase-04'){throw 'VISION_CAMPAIGN_BRANCH_REJECTED'}
          if($env:VISION_MATERIALIZATION_REQUESTED -ceq 'true' -and $env:VISION_PUSH -ceq 'true'){
            if([Text.Encoding]::UTF8.GetByteCount($env:VISION_COMMIT_MESSAGE) -gt 65536){throw 'VISION_COMMIT_MESSAGE_LIMIT'}
            if(-not $env:VISION_COMMIT_MESSAGE.Contains('[vision-materialize]')){throw 'VISION_MATERIALIZATION_MARKER_REJECTED'}
          }
      - name: Explicit reviewed synthetic native ownership cases, never OCR runtime
        if: github.ref == 'refs/heads/phase-04' && ((github.event_name == 'workflow_dispatch' && inputs.run_native_ownership == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[vision-managed]'))) && steps.validate_vision_campaign.outcome == 'success'
        run: |
          & desktop/verification/Invoke-VisionQualification.ps1 -Mode Managed
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Explicit reviewed fixed Windows materialization, never model inference
        id: vision_materialization
        if: github.ref == 'refs/heads/phase-04' && ((github.event_name == 'workflow_dispatch' && inputs.run_materialization == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[vision-materialize]'))) && steps.validate_vision_campaign.outcome == 'success'
        run: |
          $version=(& npm --version).Trim()
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if($version -cnotin @('11.9.0','11.19.1')){throw 'MATERIALIZATION_NPM_REJECTED'}
          $evidenceReady=0
          'attempted=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & desktop/verification/Invoke-VisionMaterialization.ps1 -ReviewedMaterialization -NpmVersion $version | ForEach-Object {
            Write-Output $_
            if($_ -is [string] -and $_ -ceq 'VISION_MATERIALIZATION_EVIDENCE_READY'){$evidenceReady++}
          }
          $materializationExit=$LASTEXITCODE
          if($evidenceReady -eq 1){'evidence_ready=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append}
          if($materializationExit -ne 0){exit $materializationExit}
          if($evidenceReady -ne 1){throw 'MATERIALIZATION_EVIDENCE_UNAVAILABLE'}
      - name: Retain only validated materialization metadata, including failure reports
        if: always() && steps.validate_vision_campaign.outcome == 'success' && steps.vision_materialization.outputs.attempted == 'true' && steps.vision_materialization.outputs.evidence_ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase-04-materialization-evidence-v1
          path: |
            D:\a\_temp\fonesi-p4-materialization-evidence-v1\materialization-report.json
            D:\a\_temp\fonesi-p4-materialization-evidence-v1\installed-inventory.json
            D:\a\_temp\fonesi-p4-materialization-evidence-v1\evidence-manifest.json
          if-no-files-found: error
          retention-days: 14
