.screens-grid.single{grid-template-columns:var(--screenW);justify-content:center}

/* V7 phone-wall refinements */
.screens-grid{gap:2px!important;grid-template-columns:repeat(auto-fill,var(--screenW));}
.wall-screen{gap:0!important;border-radius:5px;overflow:hidden;outline:1px solid transparent;outline-offset:-1px}
.wall-screen.active{outline:2px solid #356df3;outline-offset:-2px}
.wall-screen.picked:not(.active){outline:1px solid #9db5ee;outline-offset:-1px}
.screen-top{display:none!important}
.android-view{border:1px solid #b7c6db!important;border-radius:5px!important;aspect-ratio:9/19.5;overflow:hidden}
.android-status{height:7.8%;display:grid!important;grid-template-columns:1fr auto 1fr!important;align-items:center}
.android-time{justify-self:start}.android-status-icons{justify-self:end}
.screen-order{font-size:clamp(6px,calc(var(--screenW)*.055),13px);font-weight:900;color:#d92f42;line-height:1}
.android-home{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.android-home::-webkit-scrollbar{display:none}
.android-input-wrap{padding:3% 7%;flex:none}
.android-text-input{width:100%;height:calc(var(--screenW)*.105);min-height:12px;border:1px solid #b8c8df;border-radius:5px;background:#fff;color:#24334b;font-size:clamp(5px,calc(var(--screenW)*.05),10px);padding:2px 5px}
.android-feed-demo{padding:5% 8%;font-size:clamp(5px,calc(var(--screenW)*.05),10px);color:#526987;min-height:45%;background:#eef3fb}
.android-feed-demo p{margin:5px 0}
.wall-screen:focus{outline:2px solid #356df3}

/* V7 account registry, device actions and input control */
.identity-avatar{width:30px;height:30px;border-radius:50%;background:var(--avatar-bg,#60758f);color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:850;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #dfe6f0}
.identity-avatar.sm{width:23px;height:23px;font-size:8px}
.account-row{border:1px solid #e3e9f1;border-radius:8px;margin:7px 0;overflow:hidden;background:#fff}
.account-main{display:flex;align-items:center;gap:9px;padding:10px}
.account-copy{display:grid;gap:2px;min-width:0;flex:1}.account-copy b{font-size:11px}.account-copy small{font-size:9px;color:var(--muted)}
.account-actions{display:flex;gap:5px;margin-left:auto}
.account-targets{border-top:1px solid #edf1f6;background:#fbfcfe;padding:5px 10px 7px 48px}
.target-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #f0f3f7}.target-row:last-child{border:0}.target-row>div{display:grid;gap:1px;flex:1;min-width:0}.target-row b{font-size:9px}.target-row small{font-size:8px;color:var(--muted)}
.account-list-head{display:flex;justify-content:space-between;gap:8px;font-size:9px;color:#687a92;padding:3px 0 8px}
.app-manager-actions{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.proxy-list{max-height:250px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:7px}
.proxy-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:7px;align-items:center;padding:8px;border-bottom:1px solid #edf1f6}.proxy-row:last-child{border:0}.proxy-row>div{display:grid;gap:2px}.proxy-row b{font-size:10px}.proxy-row small{font-size:8px;color:var(--muted)}
.wall-selection-box{position:absolute;border:1px dashed #356df3;background:#356df322;z-index:9;pointer-events:none}
.screens-grid{position:relative}
.android-text-input:focus{outline:2px solid #356df3;outline-offset:1px}
.opsbar{display:flex;flex-wrap:wrap;gap:5px}
.opsbar .btn{white-space:nowrap}
.device-row{grid-template-columns:25px minmax(160px,1.4fr) 90px minmax(95px,.8fr) 95px 75px}

.identity-dropdown{position:relative}
.identity-dropdown summary{list-style:none;border:1px solid #dce4ef;border-radius:7px;background:#fff;padding:6px 8px;display:flex;align-items:center;gap:7px;min-height:34px;cursor:pointer;font-size:10px}
.identity-dropdown summary::-webkit-details-marker{display:none}
.identity-dropdown summary span:nth-child(2){flex:1}
.identity-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;background:#fff;border:1px solid #dce4ef;border-radius:8px;box-shadow:0 10px 28px #1c2c4618;max-height:240px;overflow:auto;padding:4px}
.identity-menu button{width:100%;border:0;background:#fff;display:flex;align-items:center;gap:8px;padding:7px;border-radius:6px;text-align:left}
.identity-menu button:hover{background:#f3f6fc}
.identity-menu button span:nth-child(2){display:grid;gap:1px}
.identity-menu b{font-size:10px}.identity-menu small{font-size:8px;color:var(--muted)}
.comment-config{border:1px solid #e7edf5;background:#fbfcfe;border-radius:8px;padding:9px;margin:10px 0}
.comment-config .field{margin:0}

.health-table-wrap{overflow:auto;border:1px solid #e2e8f1;border-radius:8px;margin-top:12px}
.health-table{border-collapse:separate;border-spacing:0;width:100%;min-width:960px;font-size:9px}
.health-table th{position:sticky;top:0;background:#f3f6fb;color:#65778f;text-align:left;padding:9px 8px;border-bottom:1px solid #e3e9f1;font-size:8px}
.health-table td{padding:8px;border-bottom:1px solid #edf1f6;vertical-align:middle}
.health-table td:first-child b,.health-table td small{display:block}.health-table td:first-child b{font-size:10px}.health-table td small{font-size:8px;color:var(--muted);margin-top:2px}
.health-flags{display:flex;flex-wrap:wrap;gap:3px;max-width:210px}
.health-flag{font-size:7px;font-weight:800;padding:3px 5px;border-radius:4px;white-space:nowrap}
.health-flag.red{background:#fff0f1;color:#bd4354}.health-flag.amber{background:#fff6e5;color:#a16a12}.health-flag.blue{background:#edf3ff;color:#3767c8}.health-flag.green{background:#e8f7f1;color:#128467}
.warn-text{color:#b9781c}
.health-note{width:145px;font-size:9px;padding:5px 6px}

.account-metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;color:#72839a;font-size:8px}
.account-statuses{display:flex;gap:3px;flex-wrap:wrap;max-width:190px}

/* V8: Dark/Light theme */

 --blue:#79a0ff;--blueL:#1d2e4d;--green:#4bc6a0;--warn:#e5b45f;--red:#ef7887;

}

:root[data-theme="dark"] .content-card,
:root[data-theme="dark"] .stat,
:root[data-theme="dark"] .account-row,
:root[data-theme="dark"] .target-row,
:root[data-theme="dark"] .account-targets,

:root[data-theme="dark"] .wallhead,
:root[data-theme="dark"] .wall-controls,
:root[data-theme="dark"] .wall-bottom,
:root[data-theme="dark"] .wall-dropdown,
:root[data-theme="dark"] .modal,
:root[data-theme="dark"] .dialog,
:root[data-theme="dark"] .context-menu,
:root[data-theme="dark"] .app-list,
:root[data-theme="dark"] .proxy-list,
:root[data-theme="dark"] .tracking-account,
:root[data-theme="dark"] .tracking-metric,
:root[data-theme="dark"] .health-table-wrap,
:root[data-theme="dark"] .timeline-scroll,
:root[data-theme="dark"] .day-card,
:root[data-theme="dark"] .week-grid,
:root[data-theme="dark"] .month-grid{background:#172337!important;color:#e4ebf6!important;border-color:#2b3a50!important}
:root[data-theme="dark"] .topbar{border-bottom-color:#2b3a50}
:root[data-theme="dark"] .crumb strong,
:root[data-theme="dark"] .account-copy b,
:root[data-theme="dark"] .target-row b,
:root[data-theme="dark"] .pagehead h1,
:root[data-theme="dark"] .content-card b,
:root[data-theme="dark"] .tracking-account-title b{color:#eaf0fa}

:root[data-theme="dark"] select,
:root[data-theme="dark"] textarea,
:root[data-theme="dark"] .identity-dropdown summary,
:root[data-theme="dark"] .identity-menu,
:root[data-theme="dark"] .identity-menu button{background:#111c2d!important;color:#e4ebf6!important;border-color:#35465f!important}

:root[data-theme="dark"] .account-targets,
:root[data-theme="dark"] .tracking-account-foot{background:#1b2a40!important}
:root[data-theme="dark"] .health-table th,
:root[data-theme="dark"] .table th,
:root[data-theme="dark"] .time-header,
:root[data-theme="dark"] .lane-name{background:#1d2b41!important;color:#c7d4e6!important}
:root[data-theme="dark"] .health-table td,
:root[data-theme="dark"] .target-row,
:root[data-theme="dark"] .account-row,
:root[data-theme="dark"] .app-row{border-color:#2b3a50!important}
:root[data-theme="dark"] .app-row:hover,
:root[data-theme="dark"] .tracking-account:hover{background:#1d2c43!important}
:root[data-theme="dark"] .app-row-copy small,
:root[data-theme="dark"] .tracking-account-title small{color:#9aa9bd}
:root[data-theme="dark"] .wall-screen{background:#111c2d}
:root[data-theme="dark"] .calendar-filters,
:root[data-theme="dark"] .tracking-filters,
:root[data-theme="dark"] .tracking-bars{background:#172337!important;border-color:#2b3a50!important}
:root[data-theme="dark"] .notice{background:#1d2d45;color:#c8d8ef;border-color:#344a69}
:root[data-theme="dark"] .notice.warn{background:#382d1d;color:#f0d5a5;border-color:#6c542d}
:root[data-theme="dark"] .pill{filter:saturate(.85)}
:root[data-theme="dark"] .btn{background:#1e2d43;color:#dce7f6;border-color:#35465f}
:root[data-theme="dark"] .btn.primary{background:#315fc9;color:white;border-color:#315fc9}
:root[data-theme="dark"] .user-badge{background:#263a5a;color:#e8efff}
#theme-toggle{min-width:31px;display:grid;place-items:center}
#theme-icon .uc{width:16px;height:16px}

/* App manager: icon first, then app name and package */
.app-row{grid-template-columns:17px 34px minmax(0,1fr) 62px 66px!important;gap:8px!important}
.app-row-icon{display:grid;place-items:center}
.app-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;overflow:hidden;background:var(--app-icon-bg,#64748b);color:#fff;font-size:17px;font-weight:850;box-shadow:inset 0 0 0 1px #00000010}
.app-icon-brand{background:transparent;box-shadow:none}
.app-icon-brand .brand-svg{width:30px;height:30px}
.app-row-copy{display:grid;gap:2px;min-width:0}
.app-row-copy b{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-row-copy small{font-size:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Growth tracking */
.tracking-account-list{display:grid;gap:8px;margin-top:10px}
.tracking-account{border:1px solid #e3e9f1;border-radius:8px;padding:10px;background:#fff}
.tracking-account.selected{border-color:#8eafff;box-shadow:inset 3px 0 #4779ec}
.tracking-account-main{display:grid;grid-template-columns:34px minmax(130px,1.2fr) minmax(100px,.7fr) auto;gap:9px;align-items:center}
.tracking-account-title{display:grid;gap:2px;min-width:0}
.tracking-account-title b{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tracking-account-title small{font-size:8px;color:#7d8da2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tracking-account-stats{display:grid;gap:1px}
.tracking-account-stats b{font-size:14px;font-variant-numeric:tabular-nums}
.tracking-account-stats small{font-size:8px;color:var(--muted)}
.tracking-account-actions{display:flex;gap:5px;align-items:center}
.tracking-bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:9px 0 4px;padding:8px;background:#f8fafd;border-radius:6px}
.tracking-progress{display:grid;gap:4px;min-width:0}
.tracking-progress-head{display:flex;justify-content:space-between;gap:8px;font-size:8px;color:var(--muted)}
.tracking-progress-head b{font-size:9px}
.tracking-progress-track{height:7px;background:#e8edf4;border-radius:10px;overflow:hidden}
.tracking-progress-track span{height:100%;display:block;border-radius:10px;min-width:0}
.tone-red{color:#cf465b}.tone-amber{color:#bd851e}.tone-green{color:#159776}
.tone-bg-red{background:#d94e61}.tone-bg-amber{background:#e1a83f}.tone-bg-green{background:#1ba47e}
.tracking-progress small{font-size:8px;color:var(--muted)}
.tracking-account-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:5px}
.tracking-account-foot small{font-size:8px;color:var(--muted)}
.tracking-metrics-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:12px 0}
.tracking-metric{border:1px solid var(--line);background:#fbfcfe;border-radius:7px;padding:10px;display:grid;gap:5px;min-width:0}
.tracking-metric small{font-size:8px;color:var(--muted)}
.tracking-metric b{font-size:15px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.tracking-recommendation{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.tracking-recommendation small{flex-basis:100%;font-size:8px;color:var(--muted)}
.tracking-history-row{display:grid;grid-template-columns:140px minmax(100px,1fr) 90px 120px 110px;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:9px}
.tracking-history-time{color:var(--muted);font-variant-numeric:tabular-nums}
@media(max-width:1200px){.tracking-metrics-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tracking-account-main{grid-template-columns:32px minmax(100px,1fr) 90px auto}}
@media(max-width:780px){.tracking-account-main{grid-template-columns:30px minmax(0,1fr)}.tracking-account-stats,.tracking-account-actions{grid-column:2}.tracking-bars{grid-template-columns:1fr}.tracking-metrics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tracking-history-row{grid-template-columns:1fr 1fr}.app-row{grid-template-columns:17px 32px minmax(0,1fr) 55px!important}}

[data-track-device]{cursor:default}
[data-track-device]:hover td{background:rgba(55,103,232,.055)}
[data-track-device] td{user-select:none}

/* V9 Facebook workflow grouping and group publishing */
.tree-category{margin:5px 0}
.tree-item.interaction-root{background:#fff8ed;border-color:#f1dfbf;color:#8b5a17}
.group-target-picker{display:grid;gap:5px;border:1px solid var(--line);border-radius:8px;padding:7px;max-height:240px;overflow:auto;background:#fbfcfe}
.group-target-option{display:flex;align-items:center;gap:8px;padding:7px;border:1px solid #e5eaf1;border-radius:7px;background:#fff;cursor:pointer}
.group-target-option.disabled{opacity:.55;background:#f6f7f9;cursor:not-allowed}
.group-target-copy{display:grid;gap:2px;min-width:0;flex:1}
.group-target-copy b{font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-target-copy small{font-size:8px;color:var(--muted)}
.group-target-option .pill{font-size:7px;white-space:nowrap}
.interaction-action-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.interaction-action{display:flex;align-items:center;gap:8px;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--white);cursor:pointer}
.interaction-action span{display:flex;align-items:center;gap:7px;font-size:10px}
.interaction-action svg{width:16px;height:16px}
.interaction-slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0}
.interaction-slots .slot{min-width:0}
.interaction-table{min-width:1100px}
.interaction-table textarea{min-width:190px;width:100%;font-size:9px}
.interaction-link-input{width:100%;min-width:210px;margin-top:5px;font-size:8px}
@media(max-width:900px){.interaction-action-grid{grid-template-columns:1fr}.interaction-slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
:root[data-theme="dark"] .group-target-picker,
:root[data-theme="dark"] .group-target-option{background:#172337;border-color:#2b3a50;color:#e4ebf6}
:root[data-theme="dark"] .tree-item.interaction-root{background:#382d1d;border-color:#6c542d;color:#f0d5a5}

function toast(msg){const n=$('#toast');n.textContent=msg;n.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove('show'),3400)}
function cssJob(job){const s=socialBy(job.network),key=(job.account||'')+'|'+(job.target||'');let hash=0;for(const c of key)hash=(hash*31+c.charCodeAt(0))|0;const off=(Math.abs(hash)%5)*5-10,shade=(Math.abs(hash>>3)%3)*3;let hue=s.h+off;const sat=job.network==='x'?8:65;return `--jborder:hsl(${hue} ${job.network==='x'?15:60}% ${job.network==='x'?35:42}%);--jbg:hsl(${hue} ${sat}% ${94-shade}%);--jink:hsl(${hue} ${job.network==='x'?18:60}% 27%)`}
function conflict(a,b){return a.id!==b.id && a.phone===b.phone && Math.abs(toMinute(a.when)-toMinute(b.when))<30}
function recalcQueue(){const list=jobs.slice().sort((a,b)=>toMinute(a.when)-toMinute(b.when)||socialBy(a.network).priority-socialBy(b.network).priority||a.id.localeCompare(b.id));for(const j of list){j.status=list.some(o=>o!==j&&conflict(j,o)&& (toMinute(o.when)<toMinute(j.when)||toMinute(o.when)===toMinute(j.when)&&socialBy(o.network).priority<=socialBy(j.network).priority))?'WAITING_QUEUE_DEMO':'SCHEDULED_DEMO'}}
function scheduleConflictPairs(arr){const pairs=[];for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)if(conflict(arr[i],arr[j]))pairs.push([arr[i],arr[j]]);return pairs}
function findNextSlot(item,t,occupied){let m=toMinute(t);for(let i=0;i<2000;i++){const hits=occupied.filter(x=>x.phone===item.phone&&Math.abs(toMinute(x.when)-m)<30);if(!hits.length)return fromMinute(m);m=Math.max(...hits.map(x=>toMinute(x.when)))+30;}return null}
function selOptions(entries,value,placeholder='Chọn...'){return (placeholder?`<option value="">${esc(placeholder)}</option>`:'')+entries.map(e=>`<option value="${esc(e.id)}" ${e.id===value?'selected':''}>${esc(e.label||e.name)}</option>`).join('')}
function pageHead(eyebrow,title,desc,right=''){return `<div class="pagehead"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>${right?`<div class="rowflex wrap">${right}</div>`:''}</div>`}
function submitCard(sub,title,desc){return `<div class="cardhead"><div><h2>${title}</h2><p>${desc}</p></div>${sub||''}</div>`}

function initials(name){return String(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?'}
function avatarHtml(name,network='facebook',small=false){const colors={facebook:'#1877f2',instagram:'#d44b83',threads:'#242424',x:'#171717',shopee:'#ee4d2d',zalo:'#0068ff',youtube:'#e62117',telegram:'#299ed8',tiktok:'#161616'};return `<span class="identity-avatar ${small?'sm':''}" style="--avatar-bg:${colors[network]||'#65758d'}">${esc(initials(name))}</span>`}

function trackingProgressTone(percent){
 const p=Math.max(0,Math.min(100,Number(percent)||0));
 return p<=5?'red':p<50?'amber':'green';
}
function trackingProgress(label,percent,detail=''){
 const p=Math.max(0,Math.min(100,Number(percent)||0)),tone=trackingProgressTone(p);
 return `<div class="tracking-progress"><div class="tracking-progress-head"><span>${esc(label)}</span><b class="tone-${tone}">${p.toFixed(0)}%</b></div><div class="tracking-progress-track"><span class="tone-bg-${tone}" style="width:${p}%"></span></div>${detail?`<small>${esc(detail)}</small>`:''}</div>`;
}

  instagram:[['followers','Followers'],['likes','Lượt thích'],['comments','Bình luận'],['shares','Chia sẻ'],['saves','Lưu bài'],['reach','Tiếp cận']],
  threads:[['followers','Followers'],['likes','Lượt thích'],['replies','Trả lời'],['reposts','Repost'],['views','Lượt xem']],
  x:[['followers','Followers'],['likes','Lượt thích'],['replies','Trả lời'],['reposts','Repost'],['impressions','Impressions']],
  shopee:[['followers','Followers shop'],['productViews','Lượt xem sản phẩm'],['favorites','Yêu thích'],['likes','Lượt thích']],
  zalo:[['followers','Quan tâm / theo dõi'],['views','Lượt xem'],['likes','Quan tâm'],['shares','Chia sẻ'],['comments','Bình luận']],
  youtube:[['subscribers','Người đăng ký'],['views','Lượt xem'],['likes','Lượt thích'],['comments','Bình luận'],['shares','Chia sẻ'],['watchHours','Giờ xem'],['impressions','Impressions']],
  telegram:[['members','Thành viên'],['views','Lượt xem'],['likes','Reaction'],['shares','Forward'],['comments','Bình luận']],
  tiktok:[['followers','Followers'],['likes','Lượt thích'],['views','Lượt xem video'],['comments','Bình luận'],['shares','Chia sẻ']]
 };

function accountPrimaryCount(a){
 const key=a.network==='youtube'?'subscribers':a.network==='telegram'?'members':'followers';
 return Number(a.stats?.[key]||0);
}
function recommendationSignal(a){
 const rec=a.stats?.recommendationReach,reach=a.stats?.reach;
 if(rec===null||rec===undefined||!reach)return {label:'Chưa có dữ liệu nguồn đề xuất',tone:'neutral',ratio:null};
 const ratio=rec/reach*100;
 return ratio>=30?{label:'Tỷ trọng nguồn đề xuất đáng chú ý',tone:'green',ratio}:{label:'Chưa thấy tỷ trọng đề xuất cao',tone:'amber',ratio};
}

function runTrackingScan(account){
 const t=state.tracking,seq=state.tracking.history.length+1,previous=accountPrimaryCount(account),now=new Date().toLocaleString('vi-VN');
 const key=account.network==='youtube'?'subscribers':account.network==='telegram'?'members':'followers';
 account.stats[key]=Number(account.stats[key]||0)+3+(seq%7);
 account.stats.likes+=9+(seq%13);account.stats.comments+=1+(seq%4);account.stats.shares+=1+(seq%3);account.stats.views+=120+(seq*17);account.stats.reach+=70+(seq*11);
 if(account.stats.recommendationReach!==null)account.stats.recommendationReach+=35+(seq*4);
 account.posts.forEach((p,i)=>{p.likes+=2+((seq+i)%5);p.comments+=((seq+i)%2);p.shares+=((seq+i)%3);p.views+=55+(seq*5)+(i*9);p.reach+=35+(seq*4);if(p.recommendationReach!==null)p.recommendationReach+=18+(seq*2)});
 const current=accountPrimaryCount(account),label=key==='subscribers'?'subscribers':key==='members'?'members':'followers';
 account.lastChecked=now;account.trackingSnapshots.push({time:now,followers:current,stats:{...account.stats}});
 state.tracking.history.unshift({phone:t.phone,network:account.network,time:now,accountName:account.name,networkName:socialBy(account.network).name,followers:current,delta:current-previous,primaryLabel:label});
 state.tracking.history=state.tracking.history.slice(0,160);t.lastScan=now;t.selectedAccount=account.id;
}
function scanTrackingAccounts(ids){
 const list=ids.map(id=>accountBy(id)).filter(Boolean);if(!list.length){toast('Không có tài khoản để kiểm tra.');return}
 list.forEach(runTrackingScan);

function interactionSchedule(i,index){
 const day=dayShift(i.start,Math.floor(index/Math.max(1,i.perDay))*Math.max(1,i.every));
 return `${day}T${i.slots[index%Math.max(1,i.perDay)]||'09:00'}`;
}
function createInteractionQueue(){
 const i=state.interaction,n=interactionAccountContext();
 if(!n.account||!n.target){toast('Chọn điện thoại, nick Facebook và Profile/Fanpage nguồn.');return}
 if(!i.sourceAccessConfirmed){toast('Xác nhận quyền sở hữu/ủy quyền nguồn bài viết trước.');return}
 const source=safeFacebookUrl(i.sourceUrl);
 if(i.sourceUrl&&!source){toast('Link nguồn không phải URL Facebook hợp lệ.');return}
 const rawLinks=String(i.postLinks||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const invalid=rawLinks.filter(x=>!safeFacebookUrl(x));
 if(invalid.length){toast(`${invalid.length} link không hợp lệ; chỉ chấp nhận URL Facebook HTTPS.`);return}
 const links=[...new Set(rawLinks.map(safeFacebookUrl))];
 const targetCount=Math.max(1,Math.min(100,Number(i.targetCount)||5));
 const candidates=links.length?links:[];
 const tasks=[];let skipped=0,eligiblePosts=0;
 if(i.mode==='comments'){
  const variants=(i.commentVariants||[]).map(x=>String(x||'').trim()).filter(Boolean).slice(0,10);
  if(!variants.length){toast('Nhập ít nhất một mẫu bình luận.');return}
  for(const link of candidates){
   if(eligiblePosts>=targetCount)break;
   const already=i.ledger.some(x=>x.accountId===i.account&&x.postUrl===link&&x.mode==='comments');
   if(already){skipped++;continue}
   const index=eligiblePosts++;
   tasks.push({id:`INT-${Date.now()}-${index}`,phone:i.phone,accountId:i.account,sourceTarget:i.sourceTarget,sourceTargetName:n.target.name,mode:'comments',postUrl:link,sourceUrl:source,postLabel:`Bài viết ${links.indexOf(link)+1}`,commentDraft:variants[index%variants.length],actions:[],scheduledAt:interactionSchedule(i,index),status:'NEEDS_MANUAL_REVIEW',createdAt:new Date().toISOString()});
  }
  if(source&&eligiblePosts<targetCount){
   for(let k=eligiblePosts;k<targetCount;k++){
    const index=k;
    tasks.push({id:`INT-${Date.now()}-OLD-${index}`,phone:i.phone,accountId:i.account,sourceTarget:i.sourceTarget,sourceTargetName:n.target.name,mode:'comments',postUrl:'',sourceUrl:source,postLabel:`Bài cũ hơn #${k-eligiblePosts+1} · chờ đồng bộ`,commentDraft:variants[index%variants.length],actions:[],scheduledAt:interactionSchedule(i,index),status:'WAITING_AUTHORIZED_SOURCE_SCAN',createdAt:new Date().toISOString()});
   }
  }
 }else{
  const actions=i.actions||[];
  if(!actions.length){toast('Chọn ít nhất một hành động cần xem xét.');return}
  for(const link of candidates){
   if(eligiblePosts>=targetCount)break;
   const pendingActions=actions.filter(action=>!i.ledger.some(x=>x.accountId===i.account&&x.postUrl===link&&x.mode==='reactions'&&x.action===action));
   if(!pendingActions.length){skipped++;continue}
   const postIndex=eligiblePosts++;
   for(const action of pendingActions){
    tasks.push({id:`INT-${Date.now()}-${postIndex}-${action}`,phone:i.phone,accountId:i.account,sourceTarget:i.sourceTarget,sourceTargetName:n.target.name,mode:'reactions',postUrl:link,sourceUrl:source,postLabel:`Bài viết ${links.indexOf(link)+1}`,commentDraft:'',actions:[action],scheduledAt:interactionSchedule(i,postIndex),status:'NEEDS_MANUAL_REVIEW',createdAt:new Date().toISOString()});
   }
  }
  if(source&&eligiblePosts<targetCount){
   for(let k=eligiblePosts;k<targetCount;k++){
    for(const action of actions){
     tasks.push({id:`INT-${Date.now()}-OLD-${k}-${action}`,phone:i.phone,accountId:i.account,sourceTarget:i.sourceTarget,sourceTargetName:n.target.name,mode:'reactions',postUrl:'',sourceUrl:source,postLabel:`Bài cũ hơn #${k-eligiblePosts+1} · chờ đồng bộ`,commentDraft:'',actions:[action],scheduledAt:interactionSchedule(i,k),status:'WAITING_AUTHORIZED_SOURCE_SCAN',createdAt:new Date().toISOString()});
    }
   }
  }
 }
 if(!tasks.length){toast('Không có bài mới cần đưa vào hàng đợi theo sổ hoàn tất hiện tại.');return}
 i.queue.unshift(...tasks);
 i.lastSkipped=skipped;i.lastCreated=tasks.length;i.lastEligiblePosts=eligiblePosts;
 record('Tạo hàng đợi tương tác Facebook',`${tasks.length} tác vụ · ${i.mode==='comments'?'bình luận review':'reaction/share review'} · ${skipped} bài đã hoàn tất được bỏ qua`);
 doRender();
 toast(`Đã tạo ${tasks.length} tác vụ cho ${eligiblePosts} bài chưa xử lý; bỏ qua ${skipped} bài đã ghi nhận. Các bài cũ hơn cần đồng bộ bằng nguồn được cấp quyền.`);
}
function markInteractionDone(id){
 const i=state.interaction,task=i.queue.find(x=>x.id===id);if(!task)return;
 const link=safeFacebookUrl(task.postUrl||'');if(!link){toast('Cần dán link bài viết hợp lệ trước khi đánh dấu hoàn tất.');return}
 if(task.mode==='comments')i.ledger.push({accountId:task.accountId,postUrl:link,mode:'comments',doneAt:new Date().toISOString()});
 else for(const action of task.actions||[])i.ledger.push({accountId:task.accountId,postUrl:link,mode:'reactions',action,doneAt:new Date().toISOString()});
 task.postUrl=link;task.status='DONE_MANUAL';task.completedAt=new Date().toISOString();
 i.history.unshift({time:new Date().toLocaleString('vi-VN'),accountId:task.accountId,mode:task.mode,postUrl:link});
 record('Đánh dấu tương tác hoàn tất',`${task.mode} · ${link} · xác nhận thủ công`);
 doRender();toast('Đã lưu trạng thái hoàn tất do người vận hành xác nhận.');
}

function initWallSelection(){
 const grid=$('#screens-grid');let drag=null,box=null;
 grid.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('input,button'))return;
  const tile=e.target.closest('[data-screen-id]');
  if(tile&&(e.ctrlKey||e.metaKey)){
   const id=tile.dataset.screenId;
   if(state.controlSet.has(id))state.controlSet.delete(id);else state.controlSet.add(id);
   state.monitorActive=id;state.monitorSync=state.controlSet.size>1;renderWall();e.preventDefault();return;
  }
  if(tile&&!e.shiftKey)return;
  drag={x:e.clientX,y:e.clientY,additive:e.ctrlKey||e.metaKey,base:new Set(state.controlSet)};
  box=document.createElement('div');box.className='wall-selection-box';grid.appendChild(box);
  e.preventDefault();
 });
 const move=e=>{
  if(!drag||!box)return;
  const x=Math.min(drag.x,e.clientX),y=Math.min(drag.y,e.clientY),w=Math.abs(e.clientX-drag.x),h=Math.abs(e.clientY-drag.y),r=grid.getBoundingClientRect();
  box.style.left=(x-r.left)+'px';box.style.top=(y-r.top)+'px';box.style.width=w+'px';box.style.height=h+'px';
 };
 const finish=e=>{
  if(!drag)return;
  const r=box?.getBoundingClientRect();
  if(r){const next=drag.additive?new Set(drag.base):new Set();$$('[data-screen-id]',grid).forEach(el=>{const q=el.getBoundingClientRect();if(q.right>=r.left&&q.left<=r.right&&q.bottom>=r.top&&q.top<=r.bottom)next.add(el.dataset.screenId)});if(next.size)state.controlSet=next;state.monitorSync=state.controlSet.size>1}
  box?.remove();box=null;drag=null;renderWall();
 };
 document.addEventListener('pointermove',move);document.addEventListener('pointerup',finish);document.addEventListener('pointercancel',finish);
}

function normalizedSetup(){
 const s=state.setup;let phone=phoneBy(s.phone);if(!phone){s.phone=devices[0]?.id||'';phone=phoneBy(s.phone)}
 const accounts=phone?.accounts.filter(a=>a.network===s.network)||[];
 if(!accounts.some(a=>a.id===s.account))s.account=accounts[0]?.id||'';
 const account=accounts.find(a=>a.id===s.account),targets=account?.targets||[];
 const flows=workflowDefs.filter(w=>w.network===s.network&&w.category==='ĐĂNG');
 if(!flows.some(w=>w.id===s.workflow)){
  const defaultTarget=targets.find(t=>t.type==='page')||targets.find(t=>t.type==='profile')||targets[0];
  s.workflow=flows.find(w=>w.targetType===defaultTarget?.type&&!w.groupMultiTarget)?.id||flows[0]?.id||'';
 }
 const flow=wfBy(s.workflow);
 const allowedTargets=flow?.groupMultiTarget?targets.filter(t=>t.type==='group'):targets.filter(t=>!flow?.targetTypes||flow.targetTypes.includes(t.type)||t.type===flow?.targetType);
 if(flow?.groupMultiTarget){
  const validIds=new Set(allowedTargets.filter(t=>t.membershipVerified&&t.postingAllowed).map(t=>t.id));
  s.groupTargets=(s.groupTargets||[]).filter(id=>validIds.has(id));
  s.target=s.groupTargets[0]||'';
 }else{
  if(!allowedTargets.some(t=>t.id===s.target))s.target=(allowedTargets.find(t=>t.type==='page')||allowedTargets[0])?.id||'';
  s.groupTargets=[];
 }
 const target=targets.find(t=>t.id===s.target)||null;
 return{phone,accounts,account,targets,allowedTargets,target,flows,flow};
}
function slotDefaults(count){count=Math.max(1,Math.min(24,count));const min=8*60,max=22*60,interval=count===1?0:(max-min)/(count-1);return Array.from({length:count},(_,i)=>timeOf(Math.round((min+i*interval)/5)*5))}
function slotsCollision(slots){const rows=slots.map((x,i)=>({i,min:Number(x.slice(0,2))*60+Number(x.slice(3,5))})).sort((a,b)=>a.min-b.min);const hits=new Set();for(let i=1;i<rows.length;i++){if(rows[i].min-rows[i-1].min<30){hits.add(rows[i].i);hits.add(rows[i-1].i)}}return hits}

   const item={id:`DRAFT-${m.id}-${target.id}`,phone:n.phone.id,network:s.network,account:s.account,target:target.id,targetName:target.name,workflow:s.workflow,file:m.rel,when:chosen,status:'SCHEDULED_DEMO',caption:m.caption,hashtag:m.hashtag,comments:Array.from({length:10},(_,k)=>String(m.comments[k]||'').trim()).filter(Boolean),commentDelayMinutes:s.commentDelay,commentIntervalMinutes:s.commentInterval,mediaId:m.id};

 $('#workspace').addEventListener('drop',e=>{const day=e.target.closest('[data-drop-day]');if(!day)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain'),j=jobs.find(x=>x.id===id);if(j){commitJobTime(id,day.dataset.dropDay+j.when.slice(10),'kéo sang ngày khác');doRender();toast(`Đã chuyển job ${id} sang ${prettyD(day.dataset.dropDay)}.`)}});

 document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName||'',editing=['INPUT','TEXTAREA','SELECT'].includes(tag)||document.activeElement?.isContentEditable;if(e.key==='Escape'){closeDialog();hideContext();$('#wall-dropdown').hidden=true;return}if(editing)return;if(e.key==='?'&&!e.ctrlKey){e.preventDefault();openHelp();return}if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();undoCalendar();return}if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();saveLocalDemo();return}if(state.page==='calendar'&&e.key==='ArrowLeft'){e.preventDefault();moveCalendarDate(-1)}if(state.page==='calendar'&&e.key==='ArrowRight'){e.preventDefault();moveCalendarDate(1)}});
 document.addEventListener('click',e=>{if(!e.target.closest('#context-menu'))hideContext();if(!e.target.closest('#wall-device-picker,#wall-dropdown')){$('#wall-dropdown').hidden=true;$('#wall-device-picker').setAttribute('aria-expanded','false')}});
}
startup();
</script>
</body></html>
