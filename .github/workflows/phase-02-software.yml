            if(@($lines | Where-Object {$_ -ceq 'RETAINED_MANAGED_VALIDATION_WRITTEN'}).Count -eq 1){'written=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append}
