name: Phase 02–03 software and gated development boundaries
on:
  workflow_dispatch:
    inputs:
      run_pair_package_check:
        description: 'Build and verify an app-local package from the exact retained pair; no app launch or binary upload'
        required: false
        type: boolean
        default: false
      run_pair_retention:
        description: 'Build and retain the exact reviewed pair and source evidence publicly for 14 days; no artifact execution or device operation'
        required: false
        type: boolean
        default: false
      run_notice_evidence:
        description: 'Capture exact vendor notice text only; no pair compilation, binary retention or device operation'
        required: false
        type: boolean
        default: false
      run_pair_build:
        description: 'Compile and inspect the derived server and Windows consumer; never load, upload binaries or contact devices'
        required: false
        type: boolean
        default: false
      run_video_managed:
        description: 'Compile five current sources and run 92 pure/fake managed groups; no live socket/server/device'
        required: false
        type: boolean
        default: false
      run_input_managed:
        description: 'Compile current sources and run 51 pure/fake managed input groups; no live socket/server/device'
        required: false
        type: boolean
        default: false
      run_metadata_managed:
        description: 'Compile current sources and run 39 pure/fake managed metadata groups; no live socket/server/device'
        required: false
        type: boolean
        default: false
      run_retained_rollback:
        description: 'Reviewed four-launch retained runtime rollback with current ten-group managed proof; no server/device'
        required: false
        type: boolean
        default: false
      run_package_version:
        description: 'Explicit reviewed packaged main Help VERSION development evidence'
        required: false
        default: false
        type: boolean
      run_main_version:
        description: 'Reviewed actual main Help VERSION; historical managed evidence reused, no server/device'
        required: false
        type: boolean
        default: false
      run_retained_version:
        description: 'Reviewed managed fixture and one private SOURCE VERSION/EOF campaign; no server/device'
        required: false
        type: boolean
        default: false
      run_retained_compile:
        description: 'Compile retained helper library only; never load or invoke it'
        required: false
        type: boolean
        default: false
      run_adb_version:
        description: 'Explicit reviewed version-only development check'
        required: false
        type: boolean
        default: false
      run_adb_server:
        description: 'Explicit reviewed server check only in a newly eligible absent-profile environment'
        required: false
        type: boolean
        default: false
      run_fleet_ui:
        description: 'Explicit reviewed source fleet/UI smoke without device effects'
        required: false
        type: boolean
        default: false
      run_recipient_setup:
        description: 'Reviewed local-archive recipient setup with injected native answers; no ADB execution'
        required: false
        type: boolean
        default: false
  push:
    branches: [phase-02, phase-03]
    paths:
      - '.gitattributes'
      - 'desktop/**'
      - 'foundation/**'
      - 'biome.json'
      - 'tools/phase-00/HostProbeNative.cs'
      - 'tools/phase-00/desktop-stack-lab/package-lock.json'
      - 'tools/phase-00/desktop-stack-lab/dependency-review.json'
      - '.github/workflows/phase-02-software.yml'
permissions:
  contents: read
jobs:
  windows-software-only:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Select preinstalled Python without installing
        run: |
          try {
            $candidate = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TOOL_CACHE 'Python') -Directory |
              Where-Object {$_.Name -match '^3\.12\.\d+$'} |
              Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
            if ($null -eq $candidate) { throw 'PYTHON_MISSING' }
            $exe = Join-Path $candidate.FullName 'x64/python.exe'
            $item = Get-Item -LiteralPath $exe -Force
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'PYTHON_INVALID' }
            "FOUNDATION_PYTHON_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch { Write-Output 'FOUNDATION_PYTHON_UNAVAILABLE'; exit 1 }
      - name: Scripts-disabled restore, signed tooling, lint/format and strict source check
        run: |
          node desktop/scripts/check.mjs --restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retained helper compile only without assembly execution
        if: false && (github.ref == 'refs/heads/phase-02' && ((github.event_name == 'workflow_dispatch' && inputs.run_retained_compile == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[retained-compile]'))))
        run: |
          node desktop/scripts/compile-retained-helper.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Named Windows development environment and foundation fixtures
        run: |
          Write-Output "WINDOWS_DEVELOPMENT_IMAGE=$env:ImageOS/$env:ImageVersion"
          Write-Output "SOURCE_HEAD=$env:GITHUB_SHA"
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npmVersion = (& npm --version)
          if ($LASTEXITCODE -ne 0 -or @($npmVersion).Count -ne 1) { exit 1 }
          $npmVersion = ([string]$npmVersion).Trim()
          Write-Output "ACTUAL_NPM=$npmVersion"
          node foundation/scripts/verify-bootstrap.mjs $npmVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix foundation ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --cache=.npm-cache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node foundation/scripts/check.mjs $npmVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict raw-schema synthetic tests
        run: |
          & $env:FOUNDATION_PYTHON_EXE -B -c "import sys,unittest; s=unittest.defaultTestLoader.discover('desktop/verification',pattern='test_*.py'); assert s.countTestCases()==375; r=unittest.TextTestRunner(verbosity=2).run(s); sys.exit(0 if r.wasSuccessful() and not r.skipped else 1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Explicit unavailable runtime and deferred hardware boundary
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/phase-03') {
            Write-Output 'PHASE03_SOFTWARE_ONLY'
          } else {
            Write-Output 'PHASE02_SOFTWARE_ONLY'
          }
          Write-Output 'PRODUCTION_ADB_BINARY_UNAVAILABLE'
          Write-Output 'SOURCE_JOB_NO_ADB_EXECUTION'
          Write-Output 'DEVICE_HARDWARE_NOT_RUN'
          Write-Output 'P106_CROSS_USER_UNMET_NOT_RERUN'
  owned-adb-version-development:
    if: github.ref == 'refs/heads/phase-02' && github.event_name == 'workflow_dispatch' && (inputs.run_adb_version || inputs.run_adb_server)
    needs: windows-software-only
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Select preinstalled Python without installing
        run: |
          try {
            $candidate = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TOOL_CACHE 'Python') -Directory |
              Where-Object {$_.Name -match '^3\.12\.\d+$'} |
              Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
            if ($null -eq $candidate) { throw 'PYTHON_MISSING' }
            $exe = Join-Path $candidate.FullName 'x64/python.exe'
            $item = Get-Item -LiteralPath $exe -Force
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'PYTHON_INVALID' }
            "FOUNDATION_PYTHON_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch { Write-Output 'FOUNDATION_PYTHON_UNAVAILABLE'; exit 1 }
      - name: Download exact official candidate for development inspection only
        run: |
          & $env:FOUNDATION_PYTHON_EXE -B desktop/verification/fetch_platform_tools.py ([IO.Path]::GetFullPath('desktop'))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Syntax-check bounded runner and control without execution
        if: inputs.run_adb_version
        run: |
          node --check desktop/verification/platform-tools-version-control.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'desktop/verification/Invoke-PlatformToolsVersion.ps1'),[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { Write-Output 'P201_RUNNER_SYNTAX_FAILED'; exit 1 }
      - name: Owned exact app-local version command only, no server or device operations
        if: inputs.run_adb_version
        run: |
          try { & ./desktop/verification/Invoke-PlatformToolsVersion.ps1 }
          catch { Write-Output 'P201_RUNNER_FAILED'; exit 1 }
      - name: Strict fixed-field publication, never raw capture or candidate binaries
        id: platform_tools_validation
        if: always() && inputs.run_adb_version
        run: |
          $ErrorActionPreference='Stop'
          try {
            $out=[IO.Path]::GetFullPath('artifacts/platform-tools')
            [void](New-Item -ItemType Directory -Path $out -ErrorAction Stop)
            $lines=@(& $env:FOUNDATION_PYTHON_EXE -B desktop/verification/validate_platform_tools.py publish ([IO.Path]::GetFullPath('desktop/.platform-tools-runtime/unvalidated.json')) (Join-Path $out 'validated.json') 2>&1)
            $code=$LASTEXITCODE
            foreach($line in $lines) {
              if ([string]$line -cmatch '^(PLATFORM_TOOLS_VALIDATION_WRITTEN|PLATFORM_TOOLS_HOSTED_PASS|PLATFORM_TOOLS_HOSTED_FAIL|PLATFORM_TOOLS_VALIDATION_REJECTED)$') { Write-Output ([string]$line) }
            }
            if (@($lines | Where-Object {$_ -ceq 'PLATFORM_TOOLS_VALIDATION_WRITTEN'}).Count -eq 1) {
              'written=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
            if ($code -ne 0 -or @($lines | Where-Object {$_ -ceq 'PLATFORM_TOOLS_HOSTED_PASS'}).Count -ne 1) { exit 1 }
          } catch { Write-Output 'P201_PUBLICATION_FAILED'; exit 1 }
      - name: Upload only fresh validated fixed-field evidence
        if: always() && inputs.run_adb_version && steps.platform_tools_validation.outputs.written == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: platform-tools-development-evidence
          path: artifacts/platform-tools/validated.json
          if-no-files-found: error
          retention-days: 14
      - name: Syntax-check isolated foreground server development boundary
        if: inputs.run_adb_server
        run: |
          node --check desktop/verification/platform-tools-server-control.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach($name in @('Invoke-PlatformToolsServer.ps1','Test-PlatformToolsServer.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ('desktop/verification/'+$name)),[ref]$tokens,[ref]$errors)
            if (@($errors).Count -ne 0) { Write-Output 'P202_RUNNER_SYNTAX_FAILED'; exit 1 }
          }
      - name: Owned isolated foreground server and fixed host-version health only
        if: inputs.run_adb_server
        run: |
          try { & ./desktop/verification/Invoke-PlatformToolsServer.ps1 }
          catch { Write-Output 'P202_RUNNER_FAILED'; exit 1 }
      - name: Strict server evidence publication, never profile keys or raw captures
        id: platform_tools_server_validation
        if: always() && inputs.run_adb_server
        run: |
          $ErrorActionPreference='Stop'
          try {
            $out=[IO.Path]::GetFullPath('artifacts/platform-tools-server')
            [void](New-Item -ItemType Directory -Path $out -ErrorAction Stop)
            $lines=@(& $env:FOUNDATION_PYTHON_EXE -B desktop/verification/validate_platform_tools_server.py publish ([IO.Path]::GetFullPath('desktop/.platform-tools-server-runtime/unvalidated.json')) (Join-Path $out 'validated.json') 2>&1)
            $code=$LASTEXITCODE
            foreach($line in $lines) {
              if ([string]$line -cmatch '^(PLATFORM_TOOLS_SERVER_VALIDATION_WRITTEN|PLATFORM_TOOLS_SERVER_HOSTED_PASS|PLATFORM_TOOLS_SERVER_HOSTED_FAIL|PLATFORM_TOOLS_SERVER_VALIDATION_REJECTED)$') { Write-Output ([string]$line) }
            }
            if (@($lines | Where-Object {$_ -ceq 'PLATFORM_TOOLS_SERVER_VALIDATION_WRITTEN'}).Count -eq 1) {
              'written=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
            if ($code -ne 0 -or @($lines | Where-Object {$_ -ceq 'PLATFORM_TOOLS_SERVER_HOSTED_PASS'}).Count -ne 1) { exit 1 }
          } catch { Write-Output 'P202_PUBLICATION_FAILED'; exit 1 }
      - name: Upload only fresh validated fixed-field server evidence
        if: always() && inputs.run_adb_server && steps.platform_tools_server_validation.outputs.written == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: platform-tools-server-development-evidence
          path: artifacts/platform-tools-server/validated.json
          if-no-files-found: error
          retention-days: 14

  # Schema4 source-only smoke is opt-in; historical schema3 evidence remains separately versioned.
  owned-fleet-ui-development:
    needs: windows-software-only
    # Historical schema4 UI envelope is suspended until an exact schema5 campaign is reviewed.
    if: false && ((github.event_name == 'workflow_dispatch' && inputs.run_fleet_ui) || (github.event_name == 'push' && github.ref == 'refs/heads/phase-02' && contains(github.event.head_commit.message, '[fleet-ui]')))
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Select preinstalled Python without installing
        run: |
          try {
            $candidate = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TOOL_CACHE 'Python') -Directory |
              Where-Object {$_.Name -match '^3\.12\.\d+$'} |
              Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
            if ($null -eq $candidate) { throw 'PYTHON_MISSING' }
            $exe = Join-Path $candidate.FullName 'x64/python.exe'
            $item = Get-Item -LiteralPath $exe -Force
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'PYTHON_INVALID' }
            "FOUNDATION_PYTHON_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch { Write-Output 'FOUNDATION_PYTHON_UNAVAILABLE'; exit 1 }
      - name: Restore and build exact tested source without repeating the source suite
        run: |
          $npmVersion = (& npm --version)
          if ($LASTEXITCODE -ne 0 -or @($npmVersion).Count -ne 1) { exit 1 }
          $npmVersion = ([string]$npmVersion).Trim()
          node desktop/scripts/verify-dependencies.mjs --metadata $npmVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --cache=.npm-cache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-dependencies.mjs --installed $npmVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/build.mjs $npmVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Owned source fleet UI smoke with no ADB or device effects
        run: |
          try { & ./desktop/verification/Invoke-FleetUi.ps1 }
          catch { Write-Output 'FLEET_UI_RUNNER_FAILED'; exit 1 }
      - name: Strict fleet UI evidence and separately bound screenshots
        id: fleet_validation
        if: always()
        run: |
          $ErrorActionPreference='Stop'
          try {
            $lines=@(& $env:FOUNDATION_PYTHON_EXE -B desktop/verification/validate_fleet_ui.py publish 2>&1)
            $code=$LASTEXITCODE
            foreach($line in $lines) {
              if ([string]$line -cmatch '^(FLEET_UI_VALIDATION_WRITTEN|FLEET_UI_SCREENSHOTS_BOUND|FLEET_UI_VALIDATION_PASS|FLEET_UI_VALIDATION_FAIL|FLEET_UI_VALIDATION_INVALID)$') { Write-Output ([string]$line) }
            }
            if (@($lines | Where-Object {$_ -ceq 'FLEET_UI_VALIDATION_WRITTEN'}).Count -eq 1) {
              'written=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
            if (@($lines | Where-Object {$_ -ceq 'FLEET_UI_SCREENSHOTS_BOUND'}).Count -eq 1) {
              'images=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
            if ($code -ne 0 -or @($lines | Where-Object {$_ -ceq 'FLEET_UI_VALIDATION_PASS'}).Count -ne 1) { exit 1 }
          } catch { Write-Output 'FLEET_UI_PUBLICATION_FAILED'; exit 1 }
      - name: Upload only validated fixed-field fleet evidence
        if: always() && steps.fleet_validation.outputs.written == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fleet-ui-development-evidence
          path: desktop/.fleet-ui-runtime/validated.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload only two fully bound fleet screenshots
        if: always() && steps.fleet_validation.outputs.images == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fleet-ui-development-images
          path: |
            desktop/.fleet-ui-runtime/fleet-light.png
            desktop/.fleet-ui-runtime/fleet-dark.png
          if-no-files-found: error
          retention-days: 14

  # Recipient setup is separately opt-in; injected native answers are not genuine consent.
  owned-recipient-setup-development:
    needs: windows-software-only
    if: false && ((github.event_name == 'workflow_dispatch' && inputs.run_recipient_setup) || (github.event_name == 'push' && github.ref == 'refs/heads/phase-02' && contains(github.event.head_commit.message, '[recipient-setup]')))
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
