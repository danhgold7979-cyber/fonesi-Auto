            foreach($key in @('retentionReceiptSha256','pairManifestSha256','noticeManifestSha256','evidenceManifestSha256','nodeSha256','electronManifestSha256','packageManifestSha256','archiveSha256','externalReceiptSha256')){if($report.$key -isnot [string] -or $report.$key -cnotmatch '\A[0-9a-f]{64}\z'){throw 'REPORT'}}
            $pins=@{retentionReceiptSha256='dc3e9888284b5512c4c5314890eff9591ae825db4029884bbed81c683a966e98';pairManifestSha256='934a9ff34a1b868fa56ddfc8a57d4eaba64d9d6305b6da05839566b90b366437';noticeManifestSha256='305698d5f4623d7572c1c46a515a17d0984b35d26a82ae743ebeb71a04a0ebf6';evidenceManifestSha256='7bd7125bf8f427cd10a2371f6a435b82c410bd4a0163b5626750049a7aa2a043';nodeSha256='d702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5'}
            foreach($key in $pins.Keys){if($report.$key -cne $pins[$key]){throw 'REPORT'}}
            foreach($key in @('packageFiles','packageBytes','archiveBytes')){if(($report.$key -isnot [int] -and $report.$key -isnot [long]) -or $report.$key -le 0 -or $report.$key -gt 671088640){throw 'REPORT'}}
            if($report.packageFiles -gt 511){throw 'REPORT'}
            foreach($key in @('packageVerified','archiveBound','packageRootCleanup','passed')){if($report.$key -isnot [bool] -or $report.$key -ne $true){throw 'REPORT'}}
            if((@($report.processes.PSObject.Properties.Name)-join ',') -cne 'PREPARE,ELECTRON,ATTEST,BUILD,CLEANUP'){throw 'REPORT'}
            foreach($stage in @('PREPARE','ELECTRON','ATTEST','BUILD','CLEANUP')){
              $process=$report.processes.$stage
              if((@($process.PSObject.Properties.Name)-join ',') -cne 'stage,status,exitCode,retired,stdoutTruncated,stderrTruncated' -or $process.stage -cne $stage -or $process.status -cnotin @('SUCCESS','EMPTY_OUTPUT') -or $process.exitCode -isnot [int] -or $process.exitCode -ne 0 -or $process.retired -isnot [bool] -or $process.retired -ne $true -or $process.stdoutTruncated -isnot [bool] -or $process.stdoutTruncated -ne $false -or $process.stderrTruncated -isnot [bool] -or $process.stderrTruncated -ne $false){throw 'REPORT'}
            }
            if((Read-PackageReport) -cne $raw){throw 'REPORT'}
            'passed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } catch {Write-Output 'RETAINED_PAIR_PACKAGE_RUNNER_FAILED';exit 1}
      - name: Upload only the build-only package JSON evidence
        if: success() && steps.package_check.outputs.passed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: retained-pair-package-check-evidence
          path: desktop/.retained-pair-package-check/report.json
          if-no-files-found: error
          retention-days: 14
