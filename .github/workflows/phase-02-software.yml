            foreach($line in $lines){if([string]$line -cmatch '^RETAINED_PAIR_PACKAGE_(PASS|FAIL|STAGE_(ADMISSION|ARTIFACT|NODE_LICENSE|ELECTRON|ATTEST|CANDIDATE|BUILD|VERIFY|CLEANUP|REPORT)|CONTROL_(ADMISSION|ARTIFACT|CANDIDATE|BUILD|VERIFY|CLEANUP)|SUPERVISOR_(SUCCESS|EMPTY_OUTPUT|NONZERO_EXIT|TIMEOUT|ACCESS_DENIED|LAUNCH_FAILED|CAPTURE_FAILED|CLEANUP_FAILED)_EXIT_(NULL|PRESENT)_RETIRED_(TRUE|FALSE)_STDOUT_TRUNCATED_(TRUE|FALSE)_STDERR_TRUNCATED_(TRUE|FALSE))$'){Write-Output ([string]$line)}}
            if($code -ne 0 -or $lines.Count -ne 1 -or $lines[0] -cne 'RETAINED_PAIR_PACKAGE_PASS'){throw 'WRAPPER'}
            function Read-PackageReport {
              $path=Join-Path $PWD 'desktop/.retained-pair-package-check/report.json'
              $file=Get-Item -LiteralPath $path -Force
              if($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $file.Length -lt 1 -or $file.Length -gt 8192){throw 'REPORT'}
              $stream=[IO.File]::Open($path,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
              try {
                $length=$stream.Length;if($length -lt 1 -or $length -gt 8192 -or $length -ne $file.Length){throw 'REPORT'}
                $buffer=New-Object byte[] 8193;$count=0
                while($count -lt $buffer.Length){$n=$stream.Read($buffer,$count,$buffer.Length-$count);if($n -eq 0){break};$count+=$n}
                $after=Get-Item -LiteralPath $path -Force
                if($count -ne $length -or $stream.Length -ne $length -or $after.PSIsContainer -or ($after.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $after.Length -ne $length){throw 'REPORT'}
                return (New-Object Text.UTF8Encoding($false,$true)).GetString($buffer,0,$count)
              } finally {$stream.Dispose()}
            }
            $raw=Read-PackageReport;$report=$raw|ConvertFrom-Json
            if(($report|ConvertTo-Json -Depth 12 -Compress) -cne $raw -or (@($report.PSObject.Properties.Name)-join ',') -cne 'version,scope,sourceHead,sourceTree,retainedArtifactId,retainedRunId,retentionReceiptSha256,pairManifestSha256,noticeManifestSha256,evidenceManifestSha256,nodeSha256,electronManifestSha256,packageManifestSha256,packageFiles,packageBytes,archiveBytes,archiveSha256,externalReceiptSha256,processes,packageVerified,archiveBound,packageRootCleanup,passed'){throw 'REPORT'}
