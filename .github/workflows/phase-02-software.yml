            $response=$request.GetResponse()
            try {
              if([int]$response.StatusCode -ne 200 -or $response.ContentLength -gt 1048576){throw 'LICENSE'}
              $input=$response.GetResponseStream();$output=[IO.File]::Open((Join-Path $PWD 'desktop/.retained-pair-package-node-LICENSE'),[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
              try {$buffer=New-Object byte[] 65536;$total=0;while(($count=$input.Read($buffer,0,$buffer.Length)) -gt 0){$total+=$count;if($total -gt 1048576){throw 'LICENSE'};$output.Write($buffer,0,$count)};$output.Flush($true)} finally {$output.Dispose();$input.Dispose()}
