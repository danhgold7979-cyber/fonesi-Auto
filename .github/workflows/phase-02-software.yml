            if($bytes.Length -gt 16384){throw 'REPORT_LIMIT'}
            $out=[IO.File]::Open((Join-Path $PWD 'desktop/.retained-managed-output.txt'),[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
            try{$out.Write($bytes,0,$bytes.Length);$out.Flush($true)}finally{$out.Dispose()}
            foreach($line in $lines){if([string]$line -cmatch '^RETAINED_MANAGED_(STAGE_(ADMISSION|COMPILE|FIXTURE|CLEANUP)|FIXTURE_(PASS|FAIL))$'){Write-Output ([string]$line)}}
