name: Phase 0 disposable secret restart lab
on:
  push:
    branches: ['phase/**', 'phase-*']
    paths: &secret_paths
      - 'tools/phase-00/secret-lab/**'
      - 'tools/phase-00/HostProbeNative.cs'
      - 'tools/phase-00/desktop-stack-lab/package.json'
      - 'tools/phase-00/desktop-stack-lab/package-lock.json'
      - 'tools/phase-00/desktop-stack-lab/scripts/install-electron.cjs'
      - 'tools/phase-00/desktop-stack-lab/scripts/verify-dependencies.cjs'
      - '.github/workflows/phase-00-secret-lab.yml'
  pull_request:
    paths: *secret_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase-00-secret-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-secret-source:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/phase-00/secret-lab
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Require preinstalled Python without installing
        run: |
          try {
            $candidate=Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TOOL_CACHE 'Python') -Directory |
              Where-Object {$_.Name -match '^3\.12\.\d+$'} |
              Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
            if($null -eq $candidate){throw 'PYTHON_MISSING'}
            $exe=Join-Path $candidate.FullName 'x64/python.exe'
            if(-not [IO.File]::Exists($exe)){throw 'PYTHON_MISSING'}
            "SECRET_PYTHON_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            & $exe --version
            if($LASTEXITCODE -ne 0){throw 'PYTHON_INVALID'}
          }catch{Write-Output 'PREINSTALLED_PYTHON_312_REQUIRED';exit 1}
      - name: Restore existing locked trusted packages without lifecycle scripts
        working-directory: tools/phase-00/desktop-stack-lab
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Syntax and pure raw-evidence regressions
        run: |
          node --check probe.cjs
          if($LASTEXITCODE -ne 0){exit 1}
          node --test result-contract.test.cjs
          if($LASTEXITCODE -ne 0){exit 1}
          $tokens=$null;$parseErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Invoke-SecretLab.ps1'),[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count -ne 0){Write-Output 'SECRET_PS_PARSE_FAILED';exit 1}
          & $env:SECRET_PYTHON_EXE -m unittest discover -s . -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){exit 1}
      - name: Owned supervised Electron-main secret stages1-3
        run: .\Invoke-SecretLab.ps1
      - name: Independently validate bounded raw evidence
        if: always()
        run: |
          & $env:SECRET_PYTHON_EXE validate.py
          if($LASTEXITCODE -ne 0){exit 1}
      - name: Upload only schema-validated synthetic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: g0-13-secret-restart-${{ github.sha }}
          path: tools/phase-00/secret-lab/.lab-results/validated.json
          if-no-files-found: warn
          retention-days: 7
